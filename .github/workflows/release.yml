# Builds the Mac DMG and the Windows zip. Run it by hand (Actions > Release > Run
# workflow) to get them as downloads on the run's page; push a tag like v0.1.0 to
# also attach them to a GitHub release.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Get the sounds
        run: git clone --depth 1 https://git.code.sf.net/p/crossfire/crossfire-sounds upstream/crossfire-sounds
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: crossfir3d-${{ matrix.os }}
          path: dist/*

  # One upload after both builds: a published release is locked, so a second job could
  # not add its file.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Crossfir3d.dmg
            Crossfir3d-windows.zip
